name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Augmenta JS SDK
        shell: bash
        run: |
          npm install --prefix vendor/AugmentaClientSDK-JS --no-audit --no-fund
          npm run build --prefix vendor/AugmentaClientSDK-JS

      - name: Validate example JavaScript
        shell: bash
        run: |
          for file in src/*.js; do
            node --input-type=module --check < "$file"
          done

      - name: Assemble static site
        shell: bash
        run: |
          mkdir -p _site/src _site/vendor/AugmentaClientSDK-JS/dist
          cp index.html favicon.png _site/
          cp src/*.js src/styles.css _site/src/
          cp -R vendor/AugmentaClientSDK-JS/dist/esm _site/vendor/AugmentaClientSDK-JS/dist/esm
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
