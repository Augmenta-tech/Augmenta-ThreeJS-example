name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vendor/AugmentaClientSDK-JS/package-lock.json

      - name: Build and test Augmenta JS SDK
        shell: bash
        run: |
          npm ci --prefix vendor/AugmentaClientSDK-JS --no-audit --no-fund
          npm test --prefix vendor/AugmentaClientSDK-JS

      - name: Install Pages runtime dependencies
        shell: bash
        run: |
          npm install --prefix .pages-runtime --no-save --no-package-lock --ignore-scripts three@0.186.1

      - name: Validate example JavaScript
        shell: bash
        run: |
          for file in src/*.js tests/*.mjs scripts/*.mjs; do
            node --input-type=module --check < "$file"
          done

      - name: Test example
        shell: bash
        run: |
          mkdir -p node_modules
          ln -s ../vendor/AugmentaClientSDK-JS node_modules/augmenta-client-sdk
          node --test tests/*.test.mjs

      - name: Assemble static site
        shell: bash
        run: node scripts/assemble-site.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
