name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vendor/AugmentaClientSDK-JS/package-lock.json

      - name: Build and test Augmenta JS SDK
        shell: bash
        run: |
          npm ci --prefix vendor/AugmentaClientSDK-JS --no-audit --no-fund
          npm test --prefix vendor/AugmentaClientSDK-JS

      - name: Validate example JavaScript
        shell: bash
        run: |
          for file in src/*.js tests/*.mjs; do
            node --input-type=module --check < "$file"
          done

      - name: Test example
        shell: bash
        run: |
          mkdir -p node_modules
          ln -s ../vendor/AugmentaClientSDK-JS node_modules/augmenta-client-sdk
          node --test tests/*.test.mjs

      - name: Assemble static site
        shell: bash
        run: |
          mkdir -p _site/src _site/vendor/AugmentaClientSDK-JS/dist
          cp index.html augmenta-favicon.png _site/
          cp src/*.js src/styles.css _site/src/
          cp -R vendor/AugmentaClientSDK-JS/dist/esm _site/vendor/AugmentaClientSDK-JS/dist/esm

          # GitHub Pages/browser caches can briefly mix files from adjacent
          # deployments. Stamp the local entry assets and module imports with
          # this deployment revision so a cold refresh cannot reuse stale CSS
          # or JavaScript from a previous version.
          export REV="${GITHUB_SHA::12}"
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync, writeFileSync } from 'node:fs';

          const rev = process.env.REV;
          const indexPath = '_site/index.html';
          let html = readFileSync(indexPath, 'utf8');
          html = html
            .replace('./src/styles.css', `./src/styles.css?v=${rev}`)
            .replace('./src/main.js', `./src/main.js?v=${rev}`);
          writeFileSync(indexPath, html);

          for (const name of readdirSync('_site/src').filter((name) => name.endsWith('.js'))) {
            const path = `_site/src/${name}`;
            const source = readFileSync(path, 'utf8').replace(
              /(from\s+['"])(\.\/[^'"]+\.js)(['"])/g,
              `$1$2?v=${rev}$3`
            );
            writeFileSync(path, source);
          }
          NODE

          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
