name: One-time merged branch cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Delete merged work branches
        shell: bash
        run: |
          for branch in feat/qr-copy-feedback feat/qr-hover-copy-label refactor/simple-cleanup; do
            git push origin --delete "$branch" || true
          done
