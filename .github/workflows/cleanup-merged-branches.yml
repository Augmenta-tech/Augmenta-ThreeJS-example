name: One-time merged branch cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Delete merged work branches
        shell: bash
        run: |
          for branch in             feat/idle-ui-fade             feat/persist-camera-view             feat/share-connection-qr             fix/no-sidebar-load-transition             fix/post-audit-cleanup             fix/qr-tab-favicon             fix/sidebar-idle-hide-direction             refactor/sidebar-handle-idle             refactor/simple-handle-idle             style/purple-ui-accent             style/qr-follow-sidebar             style/refine-qr-overlay
          do
            git push origin --delete "$branch" || true
          done
