name: One-time branch cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Delete merged work branches
        shell: bash
        run: |
          for branch in             chore/audit-fixes             feat/persist-viewer-settings             fix/connection-fallbacks             refactor/viewer-performance
          do
            git push origin --delete "$branch" || true
          done
